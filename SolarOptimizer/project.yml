name: SolarOptimizer
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true

targets:
  SolarOptimizer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SolarOptimizer
    info:
      path: SolarOptimizer/Info.plist
      properties:
        CFBundleDisplayName: Solar Optimizer
        UILaunchScreen:
          UIColorName: ""
        NSLocationWhenInUseUsageDescription: "Utilisée pour estimer la production solaire de votre installation"
        UIBackgroundModes:
          - fetch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.SolarOptimizer
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
